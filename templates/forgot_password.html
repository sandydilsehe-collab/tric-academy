{% extends "base.html" %}

{% block title %}Forgot Password – TRIC Academy{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 4rem; padding-bottom: 5rem;">
  <div class="card" style="padding: 2rem;">
    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Reset Your Password</h1>
    <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
      Enter your registered email address and we'll send you a password reset token.
    </p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="resetEmail">Email Address</label>
        <input type="email" id="resetEmail" name="email" class="form-control" placeholder="your.email@example.com" required autofocus>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Generate Reset Link
        </button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{{ url_for('login') }}" style="font-size: 0.85rem; color: var(--brand-primary); text-decoration: none;">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
