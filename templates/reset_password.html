{% extends "base.html" %}

{% block title %}Set New Password – TRIC Academy{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 4rem; padding-bottom: 5rem;">
  <div class="card" style="padding: 2rem;">
    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Choose a New Password</h1>
    <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
      Please enter a strong new password (minimum 6 characters).
    </p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="password" class="form-control" placeholder="••••••••" required minlength="6" autofocus>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Update Password
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
